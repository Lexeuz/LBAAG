<style>
:root{
  --night:#06080F;
  --acento:#F2B441;
  --paper:#EDE7DE;
  --muted:#8A93A8;
}
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; padding:0;
  background:var(--night); color:var(--paper);
  font-family:"Crimson Pro", Georgia, serif;
  -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center;
  min-height:100vh; padding:1.6rem;
  overflow:hidden;
}
::selection{ background:var(--acento); color:#0b0d14; }
:focus-visible{ outline:2px solid var(--acento); outline-offset:4px; }

.puerta-fondo{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(65% 55% at 50% 38%, rgba(242,180,65,.14), transparent 70%);
}

.puerta{
  position:relative; z-index:1;
  width:100%; max-width:380px;
  text-align:center;
}
.puerta__marca{
  font-family:"Rozha One", Georgia, serif;
  font-size:clamp(1.7rem, 5vw, 2.3rem);
  font-weight:400; margin:0 0 .5rem;
  color:var(--paper);
  opacity:0; animation:aparecer 1.4s .1s ease forwards;
}
.puerta__intro{
  font-size:1.02rem; line-height:1.7; font-weight:300;
  color:rgba(237,231,222,.72); margin:0 0 2.2rem;
  opacity:0; animation:aparecer 1.4s .3s ease forwards;
}
.puerta__campo{
  opacity:0; animation:aparecer 1.4s .5s ease forwards;
}
.puerta input[type="password"]{
  width:100%; background:rgba(255,255,255,.03);
  border:1px solid rgba(237,231,222,.22); border-radius:2px;
  color:var(--paper); font-family:"Crimson Pro", Georgia, serif;
  font-size:1.05rem; letter-spacing:.08em;
  padding:.85rem 1rem; text-align:center;
  transition:border-color .35s;
}
.puerta input[type="password"]::placeholder{ color:var(--muted); letter-spacing:.04em; }
.puerta input[type="password"]:focus{ border-color:var(--acento); }

.puerta__boton{
  margin-top:1rem; width:100%;
  background:transparent; color:var(--paper);
  border:1px solid rgba(237,231,222,.3); border-radius:2px;
  font-family:"Crimson Pro", Georgia, serif; font-size:.98rem; letter-spacing:.1em;
  text-transform:uppercase; padding:.85rem 1rem; cursor:pointer;
  transition:border-color .4s, color .4s, letter-spacing .4s;
}
.puerta__boton:hover:not(:disabled){ border-color:var(--acento); color:#fff; letter-spacing:.16em; }
.puerta__boton:disabled{ opacity:.55; cursor:default; }

.puerta__error{
  margin:1rem 0 0; min-height:1.3em;
  font-size:.88rem; letter-spacing:.02em;
  color:var(--acento); opacity:0;
  transition:opacity .35s;
}
.puerta__error.is-shown{ opacity:.92; }

@keyframes aparecer{
  from{ opacity:0; transform:translateY(10px); }
  to{ opacity:1; transform:none; }
}
@media (prefers-reduced-motion:reduce){
  .puerta__marca,.puerta__intro,.puerta__campo{ animation-duration:.3s; }
}
</style>
</head>
<body>

<div class="puerta-fondo" aria-hidden="true"></div>

<div class="puerta">
  <p class="puerta__marca">El Archivo</p>
  <p class="puerta__intro">Este lugar es nuestro. Necesitas la clave para entrar.</p>
  <form class="puerta__campo" id="formAcceso" autocomplete="off">
    <input type="password" id="campoClave" name="clave" placeholder="Clave" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <button type="submit" class="puerta__boton" id="botonEntrar">Entrar</button>
    <p class="puerta__error" id="mensajeError" role="alert" aria-live="polite">&nbsp;</p>
  </form>
</div>

const CLAVE_SESION = "accesoArchivo";

function b64ToBuf(b64){
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return buf.buffer;
}

async function derivarClave(password){
  const enc = new TextEncoder();
  const material = await crypto.subtle.importKey(
    'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt:b64ToBuf(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:'SHA-256' },
    material,
    { name:'AES-GCM', length:256 },
    false,
    ['decrypt']
  );
}

async function intentarDescifrar(password){
  try {
    const clave = await derivarClave(password);
    const iv = b64ToBuf(PAYLOAD.iv);
    const datos = b64ToBuf(PAYLOAD.data);
    const plano = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, clave, datos);
    return new TextDecoder().decode(plano);
  } catch (e){
    return null;
  }
}

function mostrarContenido(html){
  try { sessionStorage.setItem(CLAVE_SESION, html); } catch(e){}
  /* document.open()/write() solo reemplazan el documento entero cuando
     se llaman después de que el analizador de este mismo documento haya
     terminado (si no, el motor los trata como una inserción más dentro
     del propio análisis en curso, y el contenido de la puerta se queda
     mezclado con el contenido real). El setTimeout empuja la llamada
     fuera del análisis inicial para que sí reemplace todo el documento. */
  setTimeout(() => {
    document.open();
    document.write(html);
    document.close();
  }, 0);
}

/* si esta pestaña ya se autenticó antes (mientras siguiera abierta),
   entra directo, sin volver a pedir la clave ni mostrar la puerta */
(function restaurarSesion(){
  try {
    const guardado = sessionStorage.getItem(CLAVE_SESION);
    if (guardado){ mostrarContenido(guardado); return; }
  } catch(e){}
  /* no había sesión guardada (o falló la lectura): asegura que la
     puerta sea visible, por si el script de arriba la había ocultado */
  document.documentElement.style.visibility = '';
})();

/* control simple de intentos fallidos: una pequeña espera creciente,
   suficiente para desalentar intentos automatizados sin ser hostil
   con un despiste normal al escribir la clave */
let intentosFallidos = 0;
let bloqueadoHasta = 0;

function segundosDeEspera(n){
  if (n < 3) return 0;
  if (n < 5) return 2;
  if (n < 8) return 6;
  return 15;
}

const form = document.getElementById('formAcceso');
const campo = document.getElementById('campoClave');
const boton = document.getElementById('botonEntrar');
const error = document.getElementById('mensajeError');

function mostrarError(msg){
  error.textContent = msg;
  error.classList.add('is-shown');
}
function ocultarError(){
  error.textContent = ' ';
  error.classList.remove('is-shown');
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const ahora = Date.now();
  if (ahora < bloqueadoHasta){
    const restante = Math.ceil((bloqueadoHasta - ahora) / 1000);
    mostrarError('Espera ' + restante + ' segundos antes de volver a intentarlo.');
    return;
  }

  const password = campo.value;
  if (!password) return;

  boton.disabled = true;
  campo.disabled = true;
  const textoOriginal = boton.textContent;
  boton.textContent = 'Verificando…';
  ocultarError();

  const html = await intentarDescifrar(password);

  if (html){
    mostrarContenido(html);
    return; // el documento entero se reemplaza; no hace falta reactivar nada
  }

  intentosFallidos++;
  const espera = segundosDeEspera(intentosFallidos);
  bloqueadoHasta = Date.now() + espera * 1000;

  campo.value = '';
  boton.disabled = false;
  campo.disabled = false;
  boton.textContent = textoOriginal;
  campo.focus();
  mostrarError('La clave no es correcta.');
});
</script>
